<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js drum kit</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
</head>
<body>
    <div class="w3-grid" style="grid-template-columns: repeat(9, 1fr);  ">
 
        <div data-key="65" class="key w3-container w3-border w3-center w3-padding-35 "  style="width: 5%; display: block;">
        <kbd>A</kbd>
        <span class="sound" >clap</span>
        </div>
    

    <div data-key="83" class="key w3-container w3-border w3-center w3-padding-35 "  style="width: 5%; ">
        <kbd>S</kbd>
        <span class="sound">hihat</span>
    </div>

    <div data-key="68" class="key w3-container w3-border w3-center w3-padding-35"  style="width: 5%;  display: block;">
        <kbd>D</kbd>
        <span class="sound">kick</span>
    </div>

    <div data-key="70" class="key w3-container w3-border w3-center w3-padding-35"  style="width: 5%; display: block;">
        <kbd>F</kbd>
        <span class="sound">openhat</span>
    </div>

    <div data-key="71" class="key w3-container w3-border w3-center w3-padding-35"  style="width: 5%; display: block;">
        <kbd>G</kbd>
        <span class="sound">boom</span>
    </div>

    <div data-key="72" class="key w3-container w3-border w3-center w3-padding-35"  style="width: 5%; display: block;">
        <kbd>H</kbd>
        <span class="sound">ride</span>
    </div>

    <div data-key="74" class="key w3-container w3-border w3-center w3-padding"  style="width: 5%; display: block;">
        <kbd>J</kbd>
        <span class="sound">snore</span>
    </div>

    <div data-key="75" class="key w3-container w3-border w3-center w3-padding-35"  style="width: 5%; display: block;">
        <kbd>K</kbd>
        <span class="sound">TOM</span>
    </div>

    <div data-key="76" class="key w3-container w3-border w3-center w3-padding-35"  style="width: 5%;  display: block;">
        <kbd>L</kbd>
        <span class="sound">tink</span>
    </div>

    </div>

    <audio src="sounds/claps.wav" data-key="65"></audio>
    <audio src="sounds/hithat.wav" data-key="83"></audio>
    <audio src="sounds/kick.wav" data-key="68"></audio>
    <audio src="sounds/openhat.wav" data-key="70"></audio>
    <audio src="sounds/classicboom.wav" data-key="71"></audio>
    <audio src="sounds/ride.wav" data-key="72"></audio>
    <audio src="sounds/snaze.wav" data-key="74"></audio>
    <audio src="sounds/tom.wav" data-key="75"></audio>
    <audio src="sounds/tink.wav" data-key="76"></audio>

    <script>
        window.addEventListener('keydown',(e) =>{
            const audio = document.querySelector(`audio[data-key="${e.keyCode}"]`)
            if(!audio) return;
            audio.currentTime = 0;
            audio.play()
            //console.log(audio)  
        })
    </script>
</body>
</html>
