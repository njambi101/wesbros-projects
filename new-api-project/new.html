<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Server</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: inline-block;
            width: 80px;
        }

        input {
            padding: 4px;
            width: 200px;
        }

        button {
            margin: 10px 5px 20px 0;
            padding: 6px 12px;
            cursor: pointer;
        }

        .delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background-color: #cc0000;
        }

        table,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 6px;
            text-align: left;
        }
    </style>
</head>

<body>
    <h2>Add New User (POST)</h2>
    <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Leanne Graham">
    </div>
    <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="Bret">
    </div>
    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Sincere@april.biz">
    </div>

    <button onclick="makePost()">Submit Post Request</button>
    <button onclick="makeGet()">Fetch All Users (GET)</button>

    <h2>User List</h2>
    <table id="table1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Username</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        // GET Request Function
        function makeGet() {
            fetch('https://jsonplaceholder.typicode.com/users')
                .then((res) => res.json())
                .then(json => {
                    let rows = '';
                    json.forEach(user => {
                        rows += `<tr id="user-row-${user.id}">
                        <td>${user.name}</td>
                        <td>${user.username}</td>
                        <td>${user.email}</td>
                        <td><button class="delete-btn" onclick="makeDelete(${user.id})">Delete</button></td>
                    </tr>`;
                    });
                    document.querySelector('#table1 tbody').innerHTML = rows;
                })
        }

        // POST Request Function
        function makePost() {
            const nameInput = document.getElementById('name').value;
            const usernameInput = document.getElementById('username').value;
            const emailInput = document.getElementById('email').value;

            if (!nameInput || !usernameInput || !emailInput) {
                alert('Please fill out all fields before submitting.');
                return;
            }

            const data = {
                name: nameInput,
                username: usernameInput,
                email: emailInput
            };

            fetch('https://jsonplaceholder.typicode.com/posts', {
                method: 'POST',
                headers: {
                    'Content-type': 'application/json; charset=UTF-8',
                },
                body: JSON.stringify(data)
            })
                .then((res) => res.json())
                .then((json) => {
                    alert(`Success! User added with Mock ID: ${json.id}`);

                    // Append the newly created row with a dummy ID (like 11) for testing deletion
                    let newRow = `<tr id="user-row-${json.id}">
                    <td><b>${json.name} (New)</b></td>
                    <td>${json.username}</td>
                    <td>${json.email}</td>
                    <td><button class="delete-btn" onclick="makeDelete(${json.id})">Delete</button></td>
                </tr>`;
                    document.querySelector('#table1 tbody').innerHTML += newRow;

                    // Clear input fields
                    document.getElementById('name').value = '';
                    document.getElementById('username').value = '';
                    document.getElementById('email').value = '';
                })
        }

        // New DELETE Request Function
        function makeDelete(userId) {
            if (confirm("Are you sure you want to delete this user?")) {
                fetch(`https://jsonplaceholder.typicode.com/${userId}`, {
                    method: 'DELETE'
                })
                    .then((res) => {
                        if (res.ok) {
                            alert(`User with ID ${userId} deleted successfully.`);

                            // Dynamically remove the specific row from the UI table
                            const rowToRemove = document.getElementById(`user-row-${userId}`);
                            if (rowToRemove) {
                                rowToRemove.remove();
                            }
                        } else {
                            alert("Failed to delete user.");
                        }
                    })
                    .catch((err) => {
                        console.error('Error during deletion:', err);
                    });
            }
        }
    </script>
</body>

</html>
