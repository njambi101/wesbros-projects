<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>api server</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 6px; }
        button { margin: 10px 5px 20px 0; padding: 6px 12px; cursor: pointer; }
    </style>
</head>
<body>
    <button onclick="makeGet()">get request</button>
    <table id="table1">

        <thead>
            <tr>
                <th>Name</th>
                <th>Username</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody></tbody>
        
    </table>
    <script>
        function makeGet(){
            fetch('https://jsonplaceholder.typicode.com/users')
            .then((res) => res.json())
            .then(json => {
                let row = '';
                /*let row = `<tr><td>name</td></tr>
                    <tr><td>username</td></tr>                    
                    <tr><td>email</td></tr>`;*/ 
                json.forEach(users => {
                    row += `<tr>
                    <td>${users.name}</td>

                    <td>${users.username}</td>  

                    <td>${users.email}</td>
                    
                    </tr>`                    
                });
                document.querySelector('#table1   tbody').innerHTML = row;
            })
        }
    </script>
</body>
</html>
